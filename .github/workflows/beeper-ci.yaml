name: Beep

on:
  push:
    branches: ["beeper", "beeper-*"]
  pull_request:


jobs:
  lint-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install poetry
      - run: poetry install
      - run: poetry run ruff check --output-format=github .

  lint-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install poetry
      - run: poetry install --extras all
      - run: poetry run mypy

  # Tests

  test-trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install poetry
      - run: poetry install --extras all
      - run: poetry run trial -j4 tests

  test-sytest:
    runs-on: ubuntu-latest
    container:
      image: matrixdotorg/sytest-synapse:bookworm
      volumes:
        - ${{ github.workspace }}:/src
      env:
        SYTEST_BRANCH: c4da260e19a25d4ef86e07409ffd0fda5b2c2eb8
        TOP: ${{ github.workspace }}
        POSTGRES: 1
        MULTI_POSTGRES: 1
        WOKRERS: 1
    steps:
      - uses: actions/checkout@v7
      - name: Run SyTest
        run: /bootstrap.sh synapse
        working-directory: /src
      - name: Summarise results.tap
        if: ${{ always() }}
        run: /sytest/scripts/tap_to_gha.pl /logs/results.tap
      - name: Upload SyTest logs
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: Sytest Logs - ${{ job.status }} - (${{ join(matrix.*, ', ') }})
          path: |
            /logs/results.tap
            /logs/**/*.log*

  test-complement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: matrix-org/complement
          path: complement
          ref: 893306c6565c6b854bb3e8ce0092b2a4bb2063e9
      - name: Install complement dependencies
        run: |-
          sudo apt-get -qq update
          sudo apt-get install -qqy libolm3 libolm-dev
          go install -v github.com/gotesttools/gotestfmt/v2/cmd/gotestfmt@latest
          pip install poetry
          poetry install
      - name: Run Complement
        run: ./scripts-dev/complement.sh
        env:
          COMPLEMENT_DIR: complement

  # Builds

  build-python:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ secrets.CI_REGISTRY }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_PASSWORD }}
      - run: |-
          if [ "${{ github.ref_name }}" = "beeper" ]; then
            tag=$(cat pyproject.toml | grep -E "^version =" | sed -E 's/^version = "(.+)"$/\1/')
          else
            tag="${{ github.head_ref || github.ref_name }}"
          fi

          docker buildx build \
            --push \
            --platform linux/amd64 \
            --tag ${{ secrets.CI_REGISTRY }}/synapse:$tag-${{ github.sha }} \
            -f docker/Dockerfile \
            .

          if [ "${{ github.ref_name }}" = "beeper" ]; then
            docker pull ${{ secrets.CI_REGISTRY }}/synapse:$tag-${{ github.sha }}
            docker tag \
              ${{ secrets.CI_REGISTRY }}/synapse:$tag-${{ github.sha }} \
              ${{ secrets.CI_REGISTRY }}/synapse:latest
            docker push ${{ secrets.CI_REGISTRY }}/synapse:latest
          fi

          # Ensure the image works properly
          docker run \
            --entrypoint '' \
            ${{ secrets.CI_REGISTRY }}/synapse:$tag-${{ github.sha }} \
            python -m synapse.app.homeserver --help

          echo "Pushed image: synapse:$tag-${{ github.sha }}"
          if [ "${{ github.ref_name }}" = "beeper" ]; then
            echo "Pushed image: synapse:latest"
          fi
